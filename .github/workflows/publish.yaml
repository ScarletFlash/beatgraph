name: Publish
run-name: Publish packages from ${{ github.ref_name }}

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select_mode:
    name: Select Changesets mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version_packages:
    name: Version packages
    if: needs.select_mode.outputs.mode == 'version'
    needs: select_mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        run: rustup toolchain install

      - name: Version packages
        uses: changesets/action/version@v2
        with:
          script: pnpm run bump-version

  build_binaries:
    name: Build ${{ matrix.platform }} binary
    if: needs.select_mode.outputs.mode == 'publish'
    needs: select_mode
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - platform: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            exe: .exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        run: rustup toolchain install

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run turbo-run build:cargo --filter=beatgraph -- --release --target=${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: beatgraph-${{ matrix.platform }}
          path: packages/cli/dist/cargo/${{ matrix.target }}/release/beatgraph${{ matrix.exe }}
          if-no-files-found: error

  pack_packages:
    name: Pack packages
    needs:
      - select_mode
      - build_binaries
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run turbo-run build:rspack --filter=beatgraph

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select_mode.outputs.publish-plan-artifact-id }}

  publish_packages:
    name: Publish packages
    needs: pack_packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: beatgraph-*
          path: artifacts

      - name: Publish platform packages
        run: pnpm --filter beatgraph run publish-platform-packages "$GITHUB_WORKSPACE/artifacts"

      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack_packages.outputs.pack-dir-artifact-id }}
