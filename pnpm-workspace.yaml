packages:
  - packages/*

allowBuilds:
  esbuild: false
  wasm-pack: true

catalogMode: strict

catalogs:
  codebase:
    "@changesets/changelog-github": ^1.0.1
    "@changesets/cli": ^3.0.3
    "@pnpm/pkg-manifest.reader": ^1100.0.22
    "@pnpm/types": ^1102.1.1
    "@pnpm/workspace.projects-reader": ^1101.1.3
    "@pnpm/workspace.root-finder": ^1100.1.2
    "@pnpm/workspace.workspace-manifest-reader": ^1100.2.2
    "@rspack/cli": ^2.2.8
    "@rspack/core": ^2.2.8
    wasm-pack: ^0.15.0
  stack:
    "@types/node": ^24.19.1
    arkregex: ^0.0.13
    arktype: ^2.2.8
    detect-libc: ^2.1.2
    tsx: ^4.23.15
    turbo: ^2.11.7
    typescript: ^7.0.2

catalogPrune: true

disallowWorkspaceCycles: true

minimumReleaseAgeExclude:
  - "@beatgraph/*"

preferFrozenLockfile: true

strictDepBuilds: true

strictPeerDependencies: true

verifyDepsBeforeRun: warn
